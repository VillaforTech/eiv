name: Verify EIV
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Restore verified local research evidence
        run: python scripts/restore_evidence.py
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install --no-deps .
      - name: Installed workbench assets
        working-directory: /tmp
        run: |
          eiv --help
          python -c "from importlib.resources import files; assert 'Permission workbench' in files('eiv').joinpath('assets/workbench.html').read_text()"
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - name: Restore verified local research evidence
        run: python scripts/restore_evidence.py
      - run: python scripts/reproduce.py --output build/ci-replay
      - run: python -m eiv_experiment.planner --output build/ci-planner
  portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --check portfolio/demo.js
      - run: node --check portfolio/app.js
      - run: node --test portfolio/test-demo.cjs
  release:
    needs: [test, replay, portfolio]
    if: >-
      github.event_name == 'push' &&
      github.repository == 'VillaforTech/eiv' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - name: Restore verified local research evidence for the release
        if: ${{ hashFiles('.github/release-request.json') != '' }}
        run: python scripts/restore_evidence.py
      - name: Publish an explicitly requested release
        if: ${{ hashFiles('.github/release-request.json') != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/release_github.py --publish --request .github/release-request.json
